name: 장학 공고 수집

on:
  schedule:
    - cron: "17 22 * * *"   # 매일 오전 7시 17분(한국 시간)
    - cron: "17 7 * * *"    # 매일 오후 4시 17분(한국 시간)
  workflow_dispatch: {}       # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python crawler.py

      - name: 결과 저장
        run: |
          git config user.name "kmsa-scholarship-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "장학 공고 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
